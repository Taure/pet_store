name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v1
    with:
      otp-version: '28'
      enable-eunit: false
      enable-ct: true
      ct-config: 'config/test_sys.config'
      extra-services-compose: 'docker-compose.ci.yml'
